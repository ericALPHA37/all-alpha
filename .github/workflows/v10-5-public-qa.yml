name: V10.5 Public QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Test public desktop, mobile and fallback
        shell: bash
        run: |
          cat > qa.mjs <<'JS'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';
          const base='https://ericalpha37.github.io/all-alpha/';
          const stamp=Date.now();
          const report={testedAt:new Date().toISOString(),base,checks:[]};
          const check=(name,ok,details='')=>{report.checks.push({name,ok,details});if(!ok)throw new Error(`${name}: ${details}`)};
          const browser=await chromium.launch({headless:true});
          try{
            const desktop=await browser.newContext({viewport:{width:1440,height:900}});
            const page=await desktop.newPage();
            const consoleErrors=[];
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            for(let attempt=1;attempt<=12;attempt++){
              await page.goto(`${base}?qa=${stamp}-${attempt}`,{waitUntil:'networkidle'});
              const version=await page.locator('meta[name="all-alpha-version"]').getAttribute('content');
              if(version==='10.5')break;
              if(attempt===12)check('public version 10.5',false,`received ${version}`);
              await page.waitForTimeout(10000);
            }
            check('public version 10.5',(await page.locator('meta[name="all-alpha-version"]').getAttribute('content'))==='10.5');
            await page.waitForTimeout(3400);
            check('desktop no horizontal overflow',(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth))===0);
            await page.locator('text=OBTER VOL. I').first().click();
            await page.waitForLoadState('networkidle');
            check('Volume I bypasses checkout',page.url().includes('/downloads/alpha-code-volume-i.html'),page.url());
            check('Volume I free page visible',await page.locator('text=GRATUITO · SEM BARREIRAS').isVisible());
            check('Volume I online reader link',await page.locator('text=LER ONLINE').isVisible());
            await page.screenshot({path:'v10-5-volume-i-desktop.png',fullPage:true});

            await page.goto(`${base}?qa=paid-${stamp}`,{waitUntil:'networkidle'});
            await page.waitForTimeout(3400);
            await page.locator('button:has-text("COMPRAR VOL. II")').click();
            await page.locator('#input-name').fill('QA V10.5 Público');
            await page.locator('#input-email').fill('qa.v10.5.publico@example.com');
            await page.locator('#btn-gerar').click();
            await page.locator('#step-payment.active').waitFor({timeout:15000});
            const ref=await page.locator('#ref-code').innerText();
            const amount=await page.locator('#ref-amount').innerText();
            check('Volume II real reference',/^ALPHA-[A-Z0-9]+$/.test(ref),ref);
            check('Volume II amount',amount.includes('$18 USD')&&amount.includes('1.161 MZN'),amount);
            const wa=await page.locator('#btn-whatsapp').getAttribute('href');
            check('Volume II WhatsApp data',wa?.includes('wa.me/258843895232')&&decodeURIComponent(wa).includes(ref),wa||'missing');
            await page.screenshot({path:'v10-5-paid-desktop.png',fullPage:true});
            check('desktop console errors',consoleErrors.length===0,consoleErrors.join(' | '));
            await desktop.close();

            const mobile=await browser.newContext({...devices['iPhone 13']});
            const mpage=await mobile.newPage();
            await mpage.goto(`${base}?qa=mobile-${stamp}`,{waitUntil:'networkidle'});
            await mpage.waitForTimeout(3400);
            check('mobile no horizontal overflow',(await mpage.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth))===0);
            await mpage.locator('button:has-text("COMPRAR VOL. III")').click();
            await mpage.locator('#input-name').fill('QA Mobile V10.5');
            await mpage.locator('#input-email').fill('qa.mobile.v10.5@example.com');
            await mpage.locator('#btn-gerar').click();
            await mpage.locator('#step-payment.active').waitFor({timeout:15000});
            const mAmount=await mpage.locator('#ref-amount').innerText();
            check('Volume III mobile amount',mAmount.includes('$22 USD')&&mAmount.includes('1.419 MZN'),mAmount);
            await mpage.screenshot({path:'v10-5-paid-mobile.png',fullPage:true});
            await mobile.close();

            const fallback=await browser.newContext({viewport:{width:390,height:844}});
            const fpage=await fallback.newPage();
            await fpage.route('**/functions/registarVendaLivro',route=>route.abort('failed'));
            await fpage.goto(`${base}?qa=fallback-${stamp}`,{waitUntil:'networkidle'});
            await fpage.waitForTimeout(3400);
            await fpage.locator('button:has-text("COMPRAR VOL. II")').click();
            await fpage.locator('#input-name').fill('QA Fallback');
            await fpage.locator('#input-email').fill('qa.fallback@example.com');
            await fpage.locator('#btn-gerar').click();
            await fpage.locator('#checkout-fallback.active').waitFor({timeout:5000});
            const fallbackHref=await fpage.locator('#btn-whatsapp-fallback').getAttribute('href');
            check('fallback visible',await fpage.locator('text=CONTINUAR PELO WHATSAPP').isVisible());
            check('fallback provisional reference',decodeURIComponent(fallbackHref||'').includes('ALPHA-PENDENTE-'),fallbackHref||'missing');
            check('fallback preserves data',decodeURIComponent(fallbackHref||'').includes('QA Fallback')&&decodeURIComponent(fallbackHref||'').includes('qa.fallback@example.com'));
            await fpage.screenshot({path:'v10-5-fallback-mobile.png',fullPage:true});
            await fallback.close();
          } finally {
            await browser.close();
            fs.writeFileSync('v10-5-public-qa.json',JSON.stringify(report,null,2));
          }
          JS
          node qa.mjs
          cat v10-5-public-qa.json

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-5-public-qa-evidence
          path: |
            v10-5-public-qa.json
            v10-5-*.png
          if-no-files-found: warn
